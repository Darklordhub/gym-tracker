services:
  gym-tracker-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymtrackerdb}
      POSTGRES_USER: ${POSTGRES_USER:-gymuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong secret}
    volumes:
      - gym-tracker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - gym-tracker-net

  gym-tracker-db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      gym-tracker-db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymtrackerdb}
      POSTGRES_USER: ${POSTGRES_USER:-gymuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong secret}
      PGHOST: gym-tracker-db
      PGPORT: 5432
      BACKUP_DIR: /backups
      BACKUP_RETENTION_COUNT: ${POSTGRES_BACKUP_RETENTION_COUNT:-7}
      BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: ["/bin/sh", "/scripts/postgres-backup.sh"]
    volumes:
      - ./scripts/postgres-backup.sh:/scripts/postgres-backup.sh:ro
      - gym-tracker-postgres-backups:/backups
    networks:
      - gym-tracker-net

  gym-tracker-api:
    image: ghcr.io/darklordhub/gym-tracker-api:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Http__UseHttpsRedirection: "false"
      App__AllowStartupWithMigrationFailure: ${APP_ALLOW_STARTUP_WITH_MIGRATION_FAILURE:-false}
      ConnectionStrings__DefaultConnection: Host=gym-tracker-db;Port=5432;Database=${POSTGRES_DB:-gymtrackerdb};Username=${POSTGRES_USER:-gymuser};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong secret}
      Cors__AllowedOrigins__0: ${APP_BASE_URL:-http://localhost:8080}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set to a random string at least 32 characters long}
      Jwt__Issuer: ${JWT_ISSUER:-gym-tracker-api}
      Jwt__Audience: ${JWT_AUDIENCE:-gym-tracker-app}
      Jwt__ExpirationHours: ${JWT_EXPIRATION_HOURS:-24}
      Nutrition__UsdaApiKey: ${Nutrition__UsdaApiKey:-}
      LegacyUser__Email: ${LEGACY_USER_EMAIL:-}
      LegacyUser__Password: ${LEGACY_USER_PASSWORD:-}
      MediaStorage__RootPath: /app/media
      MediaStorage__PublicBaseUrl: ${APP_BASE_URL:-http://localhost:8080}/media
      MediaStorage__MaxFileSizeMb: ${MEDIA_STORAGE_MAX_FILE_SIZE_MB:-100}
      MediaGeneration__Enabled: ${MEDIA_GENERATION_ENABLED:-false}
      MediaGeneration__Provider: ${MEDIA_GENERATION_PROVIDER:-OpenAI}
      MediaGeneration__MaxJobsPerDay: ${MEDIA_GENERATION_MAX_JOBS_PER_DAY:-10}
      MediaGeneration__MaxJobsPerHour: ${MEDIA_GENERATION_MAX_JOBS_PER_HOUR:-3}
      MediaGeneration__MaxJobsPerDraftPerDay: ${MEDIA_GENERATION_MAX_JOBS_PER_DRAFT_PER_DAY:-2}
      MediaGeneration__CooldownSeconds: ${MEDIA_GENERATION_COOLDOWN_SECONDS:-120}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__VideoModel: ${OPENAI_VIDEO_MODEL:-sora-2}
      OpenAI__VideoSeconds: ${OPENAI_VIDEO_SECONDS:-4}
      OpenAI__VideoSize: ${OPENAI_VIDEO_SIZE:-1280x720}
      OpenAI__TimeoutSeconds: ${OPENAI_TIMEOUT_SECONDS:-60}
    depends_on:
      - gym-tracker-db
    volumes:
      - gym-tracker-exercise-media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gym-tracker-net

  gym-tracker-web:
    image: ghcr.io/darklordhub/gym-tracker-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - gym-tracker-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - gym-tracker-net

volumes:
  gym-tracker-postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-gym-tracker_gym-tracker-postgres-data}
  gym-tracker-postgres-backups:
    name: ${POSTGRES_BACKUP_VOLUME_NAME:-gym-tracker_gym-tracker-postgres-backups}
  gym-tracker-exercise-media:
    name: ${EXERCISE_MEDIA_VOLUME_NAME:-gym-tracker_gym-tracker-exercise-media}

networks:
  gym-tracker-net:
    driver: bridge
